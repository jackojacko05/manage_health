name: public-boundary

on:
  push:
    paths:
      - "PUBLIC_SCOPE.md"
      - "PRIVATE_MIGRATION.md"
      - "COMPATIBILITY.md"
      - "private-extension-manifest.json"
      - "scripts/**"
      - "hae-receiver/**"
      - "sql/**"
      - "tests/**"
      - ".github/workflows/public-boundary.yml"
  pull_request:
    paths:
      - "PUBLIC_SCOPE.md"
      - "PRIVATE_MIGRATION.md"
      - "COMPATIBILITY.md"
      - "private-extension-manifest.json"
      - "scripts/**"
      - "hae-receiver/**"
      - "sql/**"
      - "tests/**"
      - ".github/workflows/public-boundary.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate private boundary manifest
        run: python3 scripts/validate_private_extension_manifest.py
      - name: Test private boundary manifest validator
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Check public release script
        run: bash -n scripts/verify-public-release.sh && bash scripts/verify-public-release.sh --report
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate SQL contracts
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: hae-receiver/package-lock.json
      - name: Test public receiver
        run: npm ci --prefix hae-receiver && npm test --prefix hae-receiver
      - name: Check patch whitespace
        run: git diff --check
